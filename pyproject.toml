[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atandn"
dynamic = ["version"]
description = "ATAN-DN: mission-agnostic attention network with Bounded-Influence Gain Normalization for satellite telemetry anomaly detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.8.0",
    "numpy>=1.26",
    "pandas>=2.3",
    "pyarrow>=21.0",
    "optuna>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.1", "ruff"]
# esa: placeholder. The official ESA-ADB scoring package is not published under a verified name/entry point
# here; install it by following the ESA-ADB repository instructions (see README, "Evaluation protocol").
esa = []

[tool.setuptools.dynamic]
version = {attr = "atandn.__version__"}

[tool.setuptools.packages.find]
include = ["atandn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
