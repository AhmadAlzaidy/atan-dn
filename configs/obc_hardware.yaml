# ======================================================================================================================
# WARNING: UNVERIFIED VALUES. Every platform below carries `verified: false`.
#  * All peak_gflops / efficiency numbers were copied from the legacy script
#    Final_code/ablation/other/latency.py (dictionary target_hardware, section "5. Project to Target OBC Hardware").
#    They were NOT re-checked against vendor data sheets (peak figures of rad-hard parts are often vendor marketing or
#    estimates, and "efficiency" is an assumption, not a measurement).
#  * NAME MISMATCH: the paper names "BAE RAD45"; the legacy script (and this file) says "BAE RAD5545". Decide which
#    platform the paper means before citing a row.
#  * The paper's latency table (Table latency_compact) does NOT agree with these values: back-solving its latencies with
#    F = 9.28e7 FLOPs and efficiency 0.5 gives different peaks (e.g. 5015 / 1031 / 395 GFLOPS for the first three
#    platforms). Decide which set the paper cites.
#  * The projection is theoretical (flops / (efficiency * peak)); no measurement on any of these devices was made.
# Numbers below are unchanged from the legacy script.
# ======================================================================================================================
#
# On-board-computer platforms for the theoretical latency projection (scripts/complexity.py --project).
#
# latency_ms = flops / (efficiency * peak_gflops * 1e9) * 1e3   (atandn/evaluation/projection.py)
#
decision_period_s: 1.0     # "conservative 1 Hz decision rate" of the paper
realtime_fraction: 0.5     # class rule inferred from the paper's table, see projection.py

platforms:
